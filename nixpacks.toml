# nixpacks.toml
[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.pdo_mysql",
    "php83Extensions.mysqli",
    "php83Extensions.mysql"
]

[phases.install]
cmds = [
    "echo 'extension=pdo_mysql.so' >> /etc/php/8.3/cli/conf.d/99-pdo.ini",
    "echo 'extension=pdo_mysql.so' >> /etc/php/8.3/fpm/conf.d/99-pdo.ini",
    "echo 'extension=mysqli.so' >> /etc/php/8.3/cli/conf.d/99-mysqli.ini",
    "echo 'extension=mysqli.so' >> /etc/php/8.3/fpm/conf.d/99-mysqli.ini",
    "cp .user.ini /etc/php/8.3/cli/conf.d/99-user.ini 2>/dev/null || true",
    "cp .user.ini /etc/php/8.3/fpm/conf.d/99-user.ini 2>/dev/null || true"
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader 2>/dev/null || true"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t public -c /etc/php/8.3/cli/conf.d/99-user.ini"